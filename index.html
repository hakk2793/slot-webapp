<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECH SLOT</title>

<style>
* { box-sizing: border-box; font-family: Arial, sans-serif; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #14f1d9, #021b1b 70%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#game {
  background: #0b0b0b;
  padding: 20px;
  border-radius: 20px;
  width: 320px;
  text-align: center;
  color: #fff;
  box-shadow: 0 0 40px #0ff;
  position: relative;
}

h1 {
  margin: 0 0 10px;
}

.top {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  margin-bottom: 10px;
}

.bet-box {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.bet-box button {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 6px;
  background: #0ff;
  font-weight: bold;
  cursor: pointer;
}

.bet-box span {
  min-width: 30px;
  text-align: center;
}

.reels {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 15px 0;
}

.reel {
  width: 60px;
  height: 60px;
  background: #000;
  border-radius: 12px;
  font-size: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 0 10px #0ff;
  transition: transform 0.1s;
}

.buttons {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 10px;
}

.buttons button {
  flex: 1;
  border: none;
  border-radius: 10px;
  padding: 10px 0;
  font-weight: bold;
  cursor: pointer;
}

.spin { background: #00e5ff; }
.auto { background: #00c853; }
.turbo { background: #ffca28; }

#bonus {
  background: gold;
  color: #000;
  padding: 8px;
  border-radius: 10px;
  margin-bottom: 6px;
}

#result {
  font-size: 14px;
  min-height: 18px;
}

/* JACKPOT EFFECT */
#jackpot {
  position: fixed;
  inset: 0;
  background: rgba(255,215,0,0.95);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  font-weight: bold;
  color: #000;
  animation: flash 0.2s infinite;
  z-index: 999;
}

@keyframes flash {
  0% { opacity: 1; }
  50% { opacity: 0.5; }
  100% { opacity: 1; }
}

.shake {
  animation: shake 0.3s;
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
  100% { transform: translateX(0); }
}
</style>
</head>

<body>

<div id="jackpot">🎉 JACKPOT 🎉</div>

<div id="game">
  <h1>🎰 TECH SLOT</h1>

  <div class="top">
    <div>💰 <span id="balance">1000</span></div>
    <div>🎁 <span id="free">0</span></div>
  </div>

  <div class="bet-box">
    <button id="minus">-</button>
    <span id="bet">10</span>
    <button id="plus">+</button>
  </div>

  <div class="reels">
    <div class="reel">⭐</div>
    <div class="reel">🍉</div>
    <div class="reel">🍒</div>
  </div>

  <div class="buttons">
    <button class="spin" id="spin">SPIN</button>
    <button class="auto" id="auto">AUTO</button>
    <button class="turbo" id="turbo">TURBO</button>
  </div>

  <div id="bonus">🎁 BONUS</div>
  <div id="result"></div>
</div>

<script>
const symbols = ["⭐","🍒","🍉","🍇","🔔"];
let balance = 1000;
let bet = 10;
let auto = false;
let turbo = false;

const reels = document.querySelectorAll(".reel");
const balanceEl = document.getElementById("balance");
const betEl = document.getElementById("bet");
const resultEl = document.getElementById("result");
const jackpotEl = document.getElementById("jackpot");

const ctx = new (window.AudioContext || window.webkitAudioContext)();

function beep(freq, time=0.1){
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.frequency.value = freq;
  o.connect(g);
  g.connect(ctx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + time);
  o.stop(ctx.currentTime + time);
}

function spin(){
  if(balance < bet) return;
  balance -= bet;
  balanceEl.textContent = balance;
  resultEl.textContent = "";

  let sameCount = 0;
  let last = null;

  reels.forEach(r=>{
    r.classList.add("shake");
    const sym = symbols[Math.floor(Math.random()*symbols.length)];
    r.textContent = sym;
    if(last === sym) sameCount++;
    last = sym;
  });

  beep(400);

  setTimeout(()=>reels.forEach(r=>r.classList.remove("shake")),200);

  if(reels[0].textContent === reels[1].textContent &&
     reels[1].textContent === reels[2].textContent){

    if(Math.random() < 0.05){
      jackpot();
      return;
    }

    const win = bet * 5;
    balance += win;
    balanceEl.textContent = balance;
    resultEl.textContent = "😎 Kazandın +" + win;
    beep(800,0.2);
  } else {
    resultEl.textContent = "😅 Kaybettin";
  }
}

function jackpot(){
  jackpotEl.style.display = "flex";
  document.body.classList.add("shake");
  beep(1200,0.5);
  balance += bet * 50;
  balanceEl.textContent = balance;

  setTimeout(()=>{
    jackpotEl.style.display = "none";
    document.body.classList.remove("shake");
  },1500);
}

document.getElementById("spin").onclick = spin;

document.getElementById("auto").onclick = ()=>{
  auto = !auto;
  if(auto){
    const loop = setInterval(()=>{
      if(!auto) return clearInterval(loop);
      spin();
    }, turbo ? 200 : 800);
  }
};

document.getElementById("turbo").onclick = ()=> turbo = !turbo;

document.getElementById("plus").onclick = ()=>{
  bet += 10;
  betEl.textContent = bet;
};

document.getElementById("minus").onclick = ()=>{
  if(bet > 10) bet -= 10;
  betEl.textContent = bet;
};
</script>

</body>
</html>
