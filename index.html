<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TECH SLOT</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #00f2ff, #001a2d);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: system-ui;
  color: #fff;
}

.card {
  background: #050b14;
  padding: 20px;
  border-radius: 18px;
  width: 320px;
  box-shadow: 0 0 40px rgba(0,255,255,.4);
  text-align: center;
}

.reels {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 15px 0;
}

.reel {
  width: 55px;
  height: 55px;
  background: #000;
  border-radius: 10px;
  font-size: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 0 10px #00ffff;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg,#00f2ff,#00ffb3);
  font-weight: bold;
  font-size: 16px;
}

select {
  background: #001a2d;
  color: #0ff;
  border-radius: 8px;
  padding: 4px;
}

.jackpot {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.9);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 50px;
  animation: flash .3s infinite;
}

@keyframes flash {
  0% { color:#0ff }
  50% { color:#fff }
  100% { color:#0ff }
}
</style>
</head>

<body>

<div class="card">
  <h3>🎰 TECH SLOT</h3>
  <div>💰 Bakiye: <span id="balance">1000</span></div>

  <div style="margin-top:6px">
    Makara:
    <select id="reelCount">
      <option value="3">3</option>
      <option value="5">5</option>
      <option value="7">7</option>
    </select>
    Bahis:
    <span id="bet">40</span>
  </div>

  <div class="reels" id="reels"></div>

  <button id="spinBtn">ÇEVİR</button>
  <div id="result"></div>
</div>

<div class="jackpot" id="jackpot">💥 JACKPOT 💥</div>

<script>
const symbols = ["🍒","🍋","🍉","🍇","⭐"];
const reelsDiv = document.getElementById("reels");
const balanceEl = document.getElementById("balance");
const result = document.getElementById("result");
const reelSelect = document.getElementById("reelCount");
const jackpot = document.getElementById("jackpot");

let balance = 1000;
let spinning = false;

const spinSound = new Audio("spin.mp3");
const winSound = new Audio("win.mp3");
const jackpotSound = new Audio("jackpot.mp3");

function buildReels(count) {
  reelsDiv.innerHTML = "";
  for (let i=0;i<count;i++) {
    const d = document.createElement("div");
    d.className = "reel";
    d.textContent = "❔";
    reelsDiv.appendChild(d);
  }
}

buildReels(3);

reelSelect.onchange = e => buildReels(+e.target.value);

document.getElementById("spinBtn").onclick = () => {
  if (spinning) return;
  spinning = true;

  const reels = document.querySelectorAll(".reel");
  const bet = 40 * reels.length;
  if (balance < bet) return alert("Bakiye yok");

  balance -= bet;
  balanceEl.textContent = balance;
  spinSound.play();

  let final = [];

  reels.forEach((r,i)=>{
    let c=0;
    const int = setInterval(()=>{
      r.textContent = symbols[Math.floor(Math.random()*symbols.length)];
      c++;
      if (c>15+i*5) {
        clearInterval(int);
        final[i]=r.textContent;
        if (final.length === reels.length) finish(final);
      }
    },80);
  });
};

function finish(arr){
  const win = arr.every(s=>s===arr[0]);
  if (win){
    const reward = arr[0]==="⭐"?500:200;
    balance+=reward;
    balanceEl.textContent=balance;
    result.textContent="🎉 Kazandın!";
    winSound.play();

    if (arr[0]==="⭐"){
      jackpot.style.display="flex";
      jackpotSound.play();
      setTimeout(()=>jackpot.style.display="none",1500);
    }
  } else {
    result.textContent="😅 Kaybettin";
  }
  spinning=false;
}
</script>

</body>
</html>
