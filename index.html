<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECH SLOT</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(180deg,#00e5ff,#003c46);
  font-family:Arial,Helvetica,sans-serif;
}

.slot{
  background:#050b12;
  color:#fff;
  width:320px;
  padding:20px;
  border-radius:18px;
  box-shadow:0 0 30px rgba(0,255,255,.4);
  text-align:center;
}

h2{margin:0 0 10px}

.info{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin-bottom:10px;
}

.reels{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:15px 0;
}

.reel{
  width:50px;
  height:50px;
  background:#0c1f2a;
  border-radius:10px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
  box-shadow:inset 0 0 10px #00ffff;
  animation:none;
}

.spinAnim{
  animation:spin .25s linear infinite;
}

@keyframes spin{
  0%{transform:translateY(0)}
  100%{transform:translateY(-10px)}
}

.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

select,button{
  border:none;
  border-radius:8px;
  padding:6px 10px;
  font-size:14px;
}

.bet button{
  width:30px;
}

.spin{
  width:100%;
  background:#00f7ff;
  padding:12px;
  font-size:16px;
  font-weight:bold;
  border-radius:10px;
}

.msg{
  margin-top:10px;
  height:20px;
}
</style>
</head>

<body>

<div class="slot">
  <h2>🎰 TECH SLOT</h2>

  <div class="info">
    <div>💰 <span id="balance">1000</span></div>
    <div>🎯 Bahis: <span id="bet">10</span></div>
  </div>

  <div class="controls">
    <select id="reelCount">
      <option value="3">Makara 3</option>
      <option value="5">Makara 5</option>
      <option value="7">Makara 7</option>
    </select>

    <div class="bet">
      <button onclick="changeBet(-10)">-</button>
      <button onclick="changeBet(10)">+</button>
    </div>
  </div>

  <div class="reels" id="reels"></div>

  <button class="spin" onclick="spin()">ÇEVİR</button>

  <div class="msg" id="msg"></div>
</div>

<!-- SESLER -->
<audio id="spinSound" src="https://assets.mixkit.co/sfx/preview/mixkit-slot-machine-spin-1930.mp3"></audio>
<audio id="winSound" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-notification-2018.mp3"></audio>

<script>
const symbols=["🍒","⭐","🍉","🍋","🍇"];
let balance=1000;
let bet=10;

const reelsDiv=document.getElementById("reels");
const msg=document.getElementById("msg");

function renderReels(){
  reelsDiv.innerHTML="";
  let count=document.getElementById("reelCount").value;
  for(let i=0;i<count;i++){
    let d=document.createElement("div");
    d.className="reel";
    d.textContent="❔";
    reelsDiv.appendChild(d);
  }
}
renderReels();
reelCount.onchange=renderReels;

function changeBet(v){
  bet=Math.max(10,bet+v);
  document.getElementById("bet").textContent=bet;
}

function spin(){
  if(balance<bet){
    msg.textContent="❌ Bakiye yok";
    return;
  }

  balance-=bet;
  document.getElementById("balance").textContent=balance;
  msg.textContent="";
  spinSound.play();

  let reels=[...document.querySelectorAll(".reel")];
  reels.forEach(r=>r.classList.add("spinAnim"));

  setTimeout(()=>{
    reels.forEach(r=>{
      r.classList.remove("spinAnim");
      r.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    });
    checkWin();
  },800);
}

function checkWin(){
  let reels=[...document.querySelectorAll(".reel")];
  let vals=reels.map(r=>r.textContent);
  let win=vals.every(v=>v===vals[0]);

  if(win){
    let prize=bet*5;
    balance+=prize;
    document.getElementById("balance").textContent=balance;
    winSound.play();
    msg.textContent="🎉 KAZANDIN +"+prize;
  }else{
    msg.textContent="😅 Az daha!";
  }
}
</script>

</body>
</html>
