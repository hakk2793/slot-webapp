<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TECH SLOT</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="slot-container">
    <h1>🎰 TECH SLOT</h1>

    <div class="top-bar">
      <div class="balance">💰 <span id="balance">1000</span></div>

      <div class="controls">
        <label>Makara</label>
        <select id="reelCount">
          <option value="3">3</option>
          <option value="5">5</option>
          <option value="7" selected>7</option>
        </select>
      </div>

      <div class="bet-control">
        <button id="betMinus">−</button>
        <span id="bet">40</span>
        <button id="betPlus">+</button>
      </div>
    </div>

    <div id="reels" class="reels"></div>

    <button id="spinBtn">ÇEVİR</button>

    <div id="result" class="result"></div>
  </div>

  <audio id="spinSound" src="sounds/spin.m4a"></audio>
  <audio id="winSound" src="sounds/win.m4a"></audio>
  <audio id="jackpotSound" src="sounds/jackpot.m4a"></audio>

  <script src="script.js"></script>
</body>
</html>
