<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECH SLOT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="screenFlash"></div>
<div id="jackpotText">💥 JACKPOT 💥</div>

<div class="slot-container" id="slotBox">
  <h1>🎰 TECH SLOT</h1>

  <div class="top">
    <div>💰 <span id="balance">1000</span></div>

    <select id="reelCount">
      <option>3</option>
      <option>5</option>
      <option selected>7</option>
    </select>

    <div class="bet">
      <button id="betMinus">−</button>
      <span id="bet">40</span>
      <button id="betPlus">+</button>
    </div>
  </div>

  <div id="reels" class="reels"></div>

  <button id="spinBtn">ÇEVİR</button>

  <div class="toggles">
    <label><input type="checkbox" id="autoSpin"> AUTO</label>
    <label><input type="checkbox" id="turbo"> TURBO</label>
  </div>

  <div id="result"></div>
</div>

<audio id="spinSound" src="sounds/spin.m4a"></audio>
<audio id="winSound" src="sounds/win.m4a"></audio>
<audio id="jackpotSound" src="sounds/jackpot.m4a"></audio>

<script src="script.js"></script>
</body>
</html>
