<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Tech Slot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="bg"></div>

<div id="jackpotOverlay" class="jackpot-overlay">
  <div class="jackpot-text">JACKPOT</div>
</div>

<div class="page">
  <div class="slot-container">

    <h1>🎰 TECH SLOT</h1>

    <div class="top-bar">
      <div>💰 <span id="balance">1000</span></div>
      <div>🎁 <span id="freeSpin">0</span></div>
      <div class="bet-box">
        <button id="betMinus">−</button>
        <span id="bet">10</span>
        <button id="betPlus">+</button>
      </div>
    </div>

    <div class="reels" id="reels"></div>

    <div class="buttons">
      <button id="spinBtn">SPIN</button>
      <button id="autoBtn">AUTO</button>
      <button id="turboBtn">TURBO</button>
    </div>

    <button id="bonusBtn" class="bonus">🎁 BONUS</button>

    <div id="result" class="result"></div>

  </div>
</div>

<!-- SESLER -->
<audio id="spinSound" src="sounds/spin.mp3" preload="auto"></audio>
<audio id="winSound" src="sounds/win.mp3" preload="auto"></audio>
<audio id="jackpotSound" src="sounds/jackpot.mp3" preload="auto"></audio>

<script src="script.js"></script>
</body>
</html>
