<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slot Oyunu</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game">
    <h1>🎰 SLOT OYUNU</h1>

    <div class="balance">
      💰 Bakiye: <span id="balance">1000</span>
    </div>

    <div class="slots">
      <div class="slot" id="slot1">⭐</div>
      <div class="slot" id="slot2">🍋</div>
      <div class="slot" id="slot3">🍒</div>
      <div class="slot" id="slot4">🍋</div>
      <div class="slot" id="slot5">⭐</div>
    </div>

    <button id="spinBtn">ÇEVİR</button>

    <div id="result"></div>

    <!-- SESLER -->
    <audio id="spinSound" src="sounds/spin.m4a"></audio>
    <audio id="winSound" src="sounds/win.m4a"></audio>
    <audio id="jackpotSound" src="sounds/jackpot.m4a"></audio>
  </div>

  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>
