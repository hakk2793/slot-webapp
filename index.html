<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tech Slot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">
  <h1>🎰 TECH SLOT</h1>

  <div class="top-bar">
    <div class="balance">💰 <span id="balance">1000</span></div>

    <div class="selector">
      🎛️ Makara
      <select id="reelCount">
        <option value="3">3</option>
        <option value="5" selected>5</option>
        <option value="7">7</option>
      </select>
    </div>

    <div class="bet">
      <button id="betMinus">−</button>
      <span id="bet">10</span>
      <button id="betPlus">+</button>
    </div>
  </div>

  <div id="reels" class="reels"></div>

  <button id="spinBtn">ÇEVİR</button>

  <div id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
