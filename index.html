<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Slot Oyunu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">
  <h1>🎰 SLOT</h1>

  <div class="top">
    <div>💰 Bakiye: <span id="balance">1000</span></div>
    <div>
      Bahis:
      <button id="betMinus">−</button>
      <span id="bet">10</span>
      <button id="betPlus">+</button>
    </div>
  </div>

  <div class="reels">
    <div class="reel">🍒</div>
    <div class="reel">🍋</div>
    <div class="reel">🍉</div>
    <div class="reel">🍇</div>
    <div class="reel">⭐</div>
  </div>

  <div class="payline"></div>

  <button id="spinBtn">ÇEVİR</button>

  <div id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
